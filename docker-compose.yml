services:
  demo-data-init:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      CRE_DATA_DIR: /data
      MARKET_DESK_MODE: "${MARKET_DESK_MODE:-demo}"
    command:
      - python
      - /app/demo/init_demo_data.py
      - --data-dir
      - /data
      - --fixture
      - /app/demo/fixtures/bank-rate-v1.csv
    volumes:
      - market-desk-demo-data:/data
    restart: "no"

  market-desk:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      demo-data-init:
        condition: service_completed_successfully
    env_file:
      - ./agent-runtime/.env
    environment:
      CRE_DATA_DIR: /data
      DEMO_FIXTURE_LABEL: Deterministic Bank Rate fixture
      HOST: 0.0.0.0
      MARKET_DESK_MODE: "${MARKET_DESK_MODE:-demo}"
      PORT: "8787"
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - market-desk-demo-data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8787/').then(response=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  # Opt-in live ingestion daemon. Bubblewrap needs CAP_SYS_ADMIN to create
  # user namespaces inside the container. Start with:
  #   MARKET_DESK_MODE=production docker compose --profile ingestion up ingestion
  ingestion:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["ingestion"]
    env_file:
      - ./agent-runtime/.env
    environment:
      CRE_DATA_DIR: /data
      MARKET_DESK_MODE: "${MARKET_DESK_MODE:-production}"
    volumes:
      - market-desk-demo-data:/data
      - ./cre.toml:/etc/cre/cre.toml:ro
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp:unconfined
    command:
      - uv
      - run
      - cre
      - --config
      - /etc/cre/cre.toml
      - daemon
      - run
      - --allow-network
      - --poll-interval-seconds
      - "${CRE_POLL_INTERVAL_SECONDS:-30}"
    restart: unless-stopped

# Demo and ingestion share the OperationalStore single-writer lease on one
# volume. macOS sandbox-exec stays canonical; bubblewrap is the Linux path.
volumes:
  market-desk-demo-data:
