[project]
name = "nan-fung"
version = "0.1.0"
description = "Free datasource tools for London office market research"
requires-python = ">=3.11"
dependencies = [
    "odfpy>=1.4,<2",
    "openpyxl>=3.1,<4",
    "pypdf>=5,<7",
]

[project.scripts]
cre = "nan_fung.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nan_fung"]
include = ["src/nan_fung/storage/migrations/*.sql"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-m 'not live and not network'"
markers = [
    "network: makes a real network request and is excluded from the offline default gate",
    "live: production-approved automatic ingestion workflow smoke test; always also network",
    "legacy_live_probe: real-network probe of a legacy SourceResult compatibility adapter",
    "restricted_live_probe: real-network probe of a policy-blocked, manual, or restricted source",
]
