[project]
name = "nan-fung"
version = "0.1.0"
description = "Free datasource tools for London office market research"
requires-python = ">=3.11"
dependencies = [
    "odfpy>=1.4,<2",
    "openpyxl>=3.1,<4",
    "pypdf>=5,<7",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nan_fung"]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
    "live: calls a public datasource over the network",
]
